# Pubblica il sito su GitHub Pages a ogni push su main che tocca la cartella web/.
# Una tantum: Settings -> Pages -> Source: "GitHub Actions".
name: Pubblica sito

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/sito.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Valori PUBBLICI per natura (finiscono comunque nel sito): la protezione dei dati
  # è data dal login e dalle policy di Supabase, non dalla segretezza di questa chiave.
  VITE_SUPABASE_URL: https://unpzkdkgnorvakiqllrb.supabase.co
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Controllo chiave pubblica
        run: |
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Manca la variabile VITE_SUPABASE_ANON_KEY (Settings -> Secrets and variables -> Actions -> Variables). Senza, il sito andrebbe online in modalità DEMO con le tue microzone: build interrotta."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Verifica che i dati demo non siano pubblicati
        run: test ! -e dist/demo.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
