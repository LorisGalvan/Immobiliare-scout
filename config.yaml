# =====================================================================
#  SCOUT IMMOBILI - configurazione
#  Tutti i percorsi sono relativi alla cartella del progetto.
# =====================================================================

territorio:
  nome: Verona                 # usato per geocoding e nomi file
  comune: Verona               # comune per URL di ricerca e geocoding
  provincia: VR
  # Slug usati dai siti per le ricerche "per comune"
  slug_immobiliare: verona     # https://www.immobiliare.it/vendita-case/verona/
  subito_regione: veneto
  subito_provincia: verona
  subito_comune: verona        # https://www.subito.it/annunci-veneto/vendita/appartamenti/verona/verona/
  idealista_slug: verona-verona

microzone:
  file: data/zone/verona.geojson   # poligoni (importati dagli Excel o generati da OSM)
  # Se un annuncio cade fuori da tutti i poligoni ma entro questa distanza (metri)
  # dal poligono più vicino, viene assegnato a quello (utile per annunci sul confine).
  tolleranza_confine_m: 60

# ---------------------------------------------------------------------
#  HINTERLAND: altri comuni nello stesso archivio e sullo stesso sito
# ---------------------------------------------------------------------
# Per aggiungere un comune basta una riga con il nome ufficiale. Il bot ricava da solo gli indirizzi
# dei portali (es. castel-d-azzano) e il file delle microzone (data/zone/castel_d_azzano.geojson);
# le microzone mancanti le disegna GitHub da OpenStreetMap (strade principali, ferrovie, fiumi).
# Per toglierne uno basta cancellare la riga (gli annunci già raccolti restano nell'archivio).
hinterland:
  attivo: true
  comuni:
    # San Giovanni Lupatoto: le 4 zone del centro sono quelle della tua mappatura (Excel); il resto del comune
    # è diviso con le stesse dimensioni (0,3-0,6 km²) usando anche le strade di quartiere
    - nome: San Giovanni Lupatoto
      livello: fine
      area_min: 300000
    - San Martino Buon Albergo
    - Villafranca di Verona
    - Bussolengo
    - Sona
    - Sommacampagna
    - Pescantina
    - Negrar di Valpolicella
    - Castel d'Azzano
    - Grezzana
    - Lavagno
    - Buttapietra
  # limiti per ogni comune (molto più piccoli di Verona): tengono basso il costo dei giri Apify
  max_annunci: 1000       # Immobiliare, Idealista, Casa.it: se un comune li raggiunge, il log lo dice
  max_aste: 100
  fasce_prezzo: []        # una ricerca unica per comune (Verona invece è spezzata in fasce)
  wikicasa_pagine: 0      # 0 = Wikicasa solo per Verona (a Verona tutti annunci di agenzie, ed è il più caro)
  apify_in_parallelo: 3   # comuni letti contemporaneamente su Apify (il giro finisce prima, il costo è lo stesso)

database: data/scout.sqlite
cartella_output: output

# ---------------------------------------------------------------------
#  SCRAPING
# ---------------------------------------------------------------------
scraping:
  user_agent: "Mozilla/5.0 (compatible; scout-immobili/1.0; uso personale)"
  pausa_min_s: 6          # pausa casuale tra due richieste (ritmo lento)
  pausa_max_s: 14
  max_tentativi: 4        # retry con backoff esponenziale
  backoff_base_s: 20
  timeout_s: 30
  # Se un sito restituisce blocchi (403/429/captcha) per N volte di fila
  # lo scraping di quel sito si ferma per questa esecuzione.
  stop_dopo_blocchi: 3
  rispetta_robots_txt: true
  # "comune": una ricerca su tutto il comune (meno richieste)
  # "microzone": una ricerca per ogni poligono (più precisa, più richieste)
  modalita: comune
  max_pagine: 40
  # I portali mostrano solo un certo numero di pagine per ricerca: spezzando la ricerca del comune
  # in fasce di prezzo si arriva a TUTTI gli annunci invece dei primi ~1.000-2.000.
  # Lista vuota [] = una ricerca unica come prima.
  fasce_prezzo: [100000, 150000, 200000, 250000, 320000, 420000, 600000]
  filtri:
    prezzo_min: 30000
    prezzo_max: 1500000
    mq_min: 20
  siti:
    immobiliare: false     # blocca le richieste automatiche (403): usare le pagine salvate in pagine_salvate/
    subito: true
    idealista: false       # attivare in fase 2 (blocchi anti-bot frequenti)
    pvp: true              # Portale Vendite Pubbliche (aste giudiziarie ufficiali): vedi aste_pvp
    immobiliare_apify: false   # Immobiliare tramite Apify (a pagamento, serve il token): vedi sezione apify
    facebook_apify: false      # Facebook Marketplace tramite Apify (a pagamento): vedi sezione facebook
    wikicasa_apify: false      # Wikicasa tramite Apify (molti privati, a pagamento): vedi sezione wikicasa
  # Dettaglio annuncio (descrizione completa, data, ascensore...) solo per
  # occasioni e candidati frazionamento, per limitare le richieste.
  scarica_dettaglio: true
  max_dettagli_per_run: 40

# Immobiliare.it tramite Apify (https://apify.com): pochi dollari ogni 1.000 annunci.
# Il token va SOLO in config.local.yaml (apify: {token: ...}) o in SCOUT_APIFY_TOKEN, mai qui.
apify:
  attore: crawloop/immobiliare-it-scraper   # alternativa: igolaizola/immobiliare-it-scraper (senza descrizione)
  max_annunci:  4000  # 200 = giro di prova; per Verona intera 4000
  max_aste: 300         # aste lette in un giro separato, con un limite proprio
  includi_aste: true    # cerca anche nella sezione aste di Immobiliare
  descrizione: true     # testo completo: serve per aste, frazionabili e mq mancanti
  attesa_max_min: 60

# Wikicasa tramite Apify: molti annunci di privati. Circa 3 $ ogni 1.000 annunci.
wikicasa:
  attore: stealth_mode/wikicasa-property-search-scraper
  slug: verona            # https://www.wikicasa.it/vendita-case/verona/
  pagine: 30                # pagine di elenco lette (circa 30 annunci l'una): 30 = tutta Verona (836 case, circa 4 $)
  annunci_per_pagina: 30
  attesa_max_min: 30

# Facebook Marketplace tramite Apify: soprattutto privati che vendono senza agenzia.
# Stesso token di Apify. Circa 15 $ ogni 1.000 annunci: 100 annunci = circa 1,50 $.
facebook:
  attore: vivid-softwares/facebook-property-scraper
  max_annunci: 100      # giro di prova
  raggio_km: 10         # attorno al centro (lat/lon); oppure metti direttamente "url:" di una ricerca Marketplace
  lat: 45.4384
  lon: 10.9916
  attesa_max_min: 30

# Portale delle Vendite Pubbliche (pvp.giustizia.it): elenco ufficiale di tutte le aste.
# I lotti vanno solo nella sezione Aste, mai nelle mediane del mercato libero.
aste_pvp:
  # servizio di ricerca usato dal sito del PVP (non documentato: se cambia, il bot lo dice nel log
  # e si salvano le pagine di ricerca dal browser in pagine_salvate/)
  api_url: "https://pvp.giustizia.it/ric-496b258c-986a1b71/ric-ms/ricerca/vendite"
  raggio_km: 0          # 0 = solo il comune del territorio
  per_pagina: 50
  max_pagine: 20
  categorie: []         # vuoto = tutte le categorie di immobili (le non residenziali le scarta la pulizia)

geocoding:
  attivo: true
  servizio: nominatim
  pausa_s: 1.1            # policy Nominatim: max 1 richiesta/secondo

# ---------------------------------------------------------------------
#  PULIZIA DATI
# ---------------------------------------------------------------------
pulizia:
  mq_min: 18
  mq_max: 1000
  prezzo_mq_min: 300       # sotto: dato dubbio (asta, nuda proprietà, errore)
  prezzo_mq_max: 15000
  # Le aste NON vanno messe qui: le riconosce il bot leggendo il testo (scout/tipo_vendita.py),
  # le toglie dalla valutazione e le elenca a parte (foglio e pagina "Aste").
  mq_dal_testo: true       # se manca il campo mq, li cerca nel testo dell'annuncio
  parole_escludi:          # annunci scartati se il titolo/descrizione contiene...
    - nuda proprietà
    - multiproprietà
  parole_escludi_titolo:   # scartati solo se nel TITOLO o nella tipologia (es. "con box auto" nella descrizione va bene)
    - posto auto
    - box auto
  parole_dubbie:           # tenuti ma segnalati
    - affittato
    - a reddito
    - usufrutto
    - rent to buy
  doppioni:
    tolleranza_mq: 3
    tolleranza_prezzo_pct: 3
    distanza_max_m: 150

# Annunci messi all'indirizzo dell'AGENZIA invece che a quello dell'immobile: restano sul sito
# con la segnalazione "indirizzo dell'agenzia", ma non entrano nelle mediane della microzona
# (le falserebbero). Il bot li riconosce da solo (sede scritta nel testo dell'annuncio, oppure
# tanti immobili diversi della stessa agenzia nello stesso punto della mappa). Le sedi che
# conosci puoi scriverle sotto "sedi": basta il nome dell'agenzia e l'indirizzo (via e civico),
# oppure lat/lon presi da Google Maps (tasto destro sul punto).
controllo_agenzia:
  attivo: true
  raggio_m: 30             # "stesso punto": entro questa distanza
  min_immobili: 3          # immobili diversi della stessa agenzia nello stesso punto per dire "è l'ufficio"
  sedi: []
  #  - agenzia: Tecnocasa Borgo Roma
  #    indirizzo: Via Centro 10
  #  - agenzia: Immobiliare Esempio
  #    lat: 45.4384
  #    lon: 10.9916
  ignora: []               # uid da non segnalare mai (es. "immobiliare:123456"), se il bot sbaglia

# ---------------------------------------------------------------------
#  ANALISI
# ---------------------------------------------------------------------
analisi:
  fasce_mq:                # [min, max) - etichetta come nei tuoi Excel
    - [30, 50, "30/50"]
    - [50, 70, "50/70"]
    - [70, 100, "70/100"]
    - [100, 10000, "100+"]
  min_campione: 3          # sotto questo numero la mediana della fascia non è affidabile
  # Con campione scarso si usa la mediana di tutta la microzona (tutte le fasce)
  fallback_mediana_zona: true
  includi_storico_giorni: 180   # annunci rimossi negli ultimi N giorni entrano nella mediana
  soglia_occasione_pct: -15     # scostamento <= -15% => Occasione
  correzioni:
    attive: true
    # coefficienti moltiplicativi: valore "normalizzato" = €/mq / coefficiente
    piano_terra: 0.93
    piano_alto_senza_ascensore: 0.92   # dal 3° piano in su senza ascensore
    attico: 1.08
    stato:
      nuovo: 1.12
      ottimo: 1.05
      buono: 1.00
      da_ristrutturare: 0.80
  omi:
    attivo: false
    file_valori: data/omi/QI_VALORI.csv       # CSV scaricato da Agenzia Entrate
    file_zone: data/omi/zone_omi.geojson      # opzionale: poligoni zone OMI
    tipologia: Abitazioni civili
    # in alternativa ai poligoni: microzona -> codice zona OMI
    mappa_microzone: {}
    #  "Borgo Trento m1": C12

# ---------------------------------------------------------------------
#  FRAZIONAMENTO
# ---------------------------------------------------------------------
frazionamento:
  attivo: true
  mq_min: 100              # soglia immobile "grande"
  mq_unita_target: 45      # superficie di ogni unità ricavata
  perdita_superficie_pct: 8   # muri, ingressi, disimpegni persi nel frazionamento
  fascia_riferimento: "30/50"  # fascia di cui usare la mediana €/mq
  sconto_prudenziale_pct: 5    # riduzione del valore post-frazionamento
  costi:
    lavori_mq: 650             # €/mq ristrutturazione su tutta la superficie
    impianti_per_unita: 9000   # nuovi contatori, caldaie, allacci
    oneri_per_unita: 3500      # oneri comunali, SCIA, accatastamento
    spese_tecniche_pct: 8      # progettista/DL sul totale lavori
    acquisto_pct: 4            # notaio + imposte su prezzo acquisto
    vendita_pct: 3             # provvigioni di vendita sul ricavato
  margine_min_pct: 10          # sotto questo il candidato non va nel foglio

# ---------------------------------------------------------------------
#  SITO WEB (Supabase)
# ---------------------------------------------------------------------
supabase:
  attivo: false
  url: "https://unpzkdkgnorvakiqllrb.supabase.co"
  # La chiave service_role va SOLO in config.local.yaml o nella variabile
  # d'ambiente SCOUT_SUPABASE_SERVICE_KEY, mai qui (questo file è su GitHub).
  service_key: ""

# ---------------------------------------------------------------------
#  ALERT
# ---------------------------------------------------------------------
alert:
  telegram:
    attivo: false
    token: ""        # oppure variabile d'ambiente SCOUT_TELEGRAM_TOKEN
    chat_id: ""      # oppure SCOUT_TELEGRAM_CHAT_ID
  email:
    attivo: false
    smtp_host: smtp.gmail.com
    smtp_port: 587
    utente: ""
    password: ""     # oppure SCOUT_SMTP_PASSWORD (per Gmail: password per le app)
    destinatari: []
  includi_frazionabili: true
